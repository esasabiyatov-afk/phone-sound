<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звук на телефон</title>
<style>
  body { font: 17px sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; text-align: center; }
  button { font-size: 22px; padding: 18px 28px; border-radius: 12px; border: 0; background: #2b7; color: #fff; margin: 16px 0; }
  #adj button { font-size: 16px; padding: 10px 14px; margin: 4px; background: #345; }
  #player-box, #vid { max-width: 480px; width: 100%; margin: 12px auto; aspect-ratio: 16/9; display: block; background: #000; }
  #player-box iframe { width: 100%; height: 100%; }
  #status { color: #aaa; font-size: 15px; min-height: 2.5em; }
  .hint { color: #888; font-size: 14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<h2>Звук на телефон</h2>
<div id="no-key" hidden>Отсканируйте QR-код на компьютере (кнопка 📱 на видео).</div>
<div id="main" hidden>
  <button id="start">Включить звук</button>
  <div id="status">Нажмите кнопку — звук пойдёт вслед за видео на компьютере.</div>
  <div id="player-box"><div id="player"></div></div>
  <video id="vid" playsinline preload="auto" hidden></video>
  <div id="adj" hidden>
    <button id="later">Звук спешит</button>
    <button id="earlier">Звук отстаёт</button>
    <div class="hint">Поправка: <span id="adj-val">0.0</span> с</div>
  </div>
  <div class="hint">Не выключайте экран телефона — иначе звук остановится.</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const key = params.get('k') || localStorage.getItem('snd-key');
if (key) localStorage.setItem('snd-key', key);
document.getElementById(key ? 'main' : 'no-key').hidden = false;
const statusEl = document.getElementById('status');
const say = t => statusEl.textContent = t;

// Ручная поправка (если звук всё же чуть расходится с картинкой), запоминается на телефоне
let adj = parseFloat(localStorage.getItem('snd-adj') || '0');
function showAdj() { document.getElementById('adj-val').textContent = (adj > 0 ? '+' : '') + adj.toFixed(1); }
function setAdj(d) { adj = Math.round((adj + d) * 10) / 10; localStorage.setItem('snd-adj', adj); showAdj(); }
document.getElementById('earlier').onclick = () => setAdj(0.1);
document.getElementById('later').onclick = () => setAdj(-0.1);
showAdj();

// Два плеера с одинаковыми действиями: YouTube (видео по id) и обычный video (фильм с другого сайта по адресу потока)
let ytPlayer = null, ytReady = false;
const yt = {
  ready: () => ytReady,
  load(id, t, play) {
    if (play) ytPlayer.loadVideoById({ videoId: id, startSeconds: t });
    else ytPlayer.cueVideoById({ videoId: id, startSeconds: t });
  },
  state() { const s = ytPlayer.getPlayerState(); return s === 1 ? 'play' : s === 3 ? 'load' : 'stop'; },
  play() { ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); },
  pause() { ytPlayer.pauseVideo(); },
  time: () => ytPlayer.getCurrentTime(),
  seek(t) { ytPlayer.seekTo(t, true); },
  rate: () => ytPlayer.getPlaybackRate(),
  setRate(r) { ytPlayer.setPlaybackRate(r); },
  smooth: false,  // у YouTube скорость шагами по 0.25 — подстраиваем только перемоткой
  title: () => (ytPlayer.getVideoData() || {}).title || '',
  show(on) { document.getElementById('player-box').hidden = !on; if (!on && ytReady) ytPlayer.stopVideo(); }
};
const vid = document.getElementById('vid');
let hls = null;
const h5 = {
  ready: () => true,
  load(url, t, play) {
    if (hls) { hls.destroy(); hls = null; }
    const m3u8 = /\.m3u8?(\?|$)/i.test(new URL(url).pathname + '?');
    // iPhone играет поток m3u8 сам; остальным — через hls.js (свой m3u8 у Chrome застревает после перемотки)
    if (m3u8 && !/Apple/.test(navigator.vendor) && window.Hls && Hls.isSupported()) {
      hls = new Hls({ startPosition: t });
      hls.loadSource(url);
      hls.attachMedia(vid);
    } else {
      vid.src = url;
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = Math.max(0, h5.pendingSeek); }, { once: true });
    }
    h5.pendingSeek = t;
    if (play) vid.play().catch(() => {});
  },
  state: () => vid.paused ? 'stop' : vid.readyState > 2 && !vid.seeking ? 'play' : 'load',
  play() { vid.muted = false; vid.volume = 1; vid.play().catch(() => {}); },
  pause() { vid.pause(); },
  time: () => vid.currentTime,
  seek(t) { vid.currentTime = t; },
  rate: () => vid.playbackRate,
  setRate(r) { vid.playbackRate = r; },
  smooth: true,  // скорость меняется плавно и без искажения звука — мелкое расхождение убираем ей, без перемоток
  title: () => (state && state.t) || '',
  show(on) { vid.hidden = !on; if (!on) vid.pause(); }
};
vid.onerror = () => say('Этот сайт не даёт открыть фильм на телефоне (поток закрыт для других устройств).');
vid.onclick = () => vid.play().catch(() => {});

// Часы ПК и телефона не совпадают. ПК пишет c — момент записи по своим часам; разница часов =
// наименьшее (момент получения по нашим часам − c) среди свежих записей: чем быстрее прочли, тем точнее.
let samples = [], diff = null;
let state = null, loadedSrc = null, seekAt = 0, lastNew = 0, P = null, started = false;
let playingSince = 0, stuckSince = 0, recent = [], justSeeked = false, lead = parseFloat(localStorage.getItem('snd-lead') || '0.2');

let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  const t0 = Date.now();
  try {
    const r = await fetch('https://api.npoint.io/' + encodeURIComponent(key) + '?_=' + t0, { cache: 'no-store' });
    const d = await r.json();
    const t1 = Date.now();
    if (!d || !(d.v || d.u) || !d.n) { if (!state) say('Жду видео с компьютера…'); return; }
    if (!state || d.n !== state.n || d.c !== state.c) {
      // берём момент получения ответа (t1), а не середину запроса: так разница часов не выходит меньше
      // настоящей и звук не убегает вперёд картинки (на мобильном интернете запрос долгий и неровный)
      samples.push(t1 - d.c);
      if (samples.length > 120) samples.shift();
      diff = Math.min(...samples);
      state = d;
      lastNew = Date.now();
      tick();
    }
  } catch (e) {
    say('Нет связи, пробую ещё…');
  } finally {
    polling = false;
  }
}

function target() {
  const pcNow = Date.now() - diff;  // «сейчас» по часам ПК
  return (state.s ? state.p + (pcNow - state.c) / 1000 * (state.r || 1) : state.p) + adj;
}

function tick() {
  if (!state) return;
  const want = state.v ? yt : h5;
  if (!want.ready()) return;
  const src = state.v || state.u;
  if (loadedSrc !== src) {
    loadedSrc = src;
    if (P !== want) { if (P) P.show(false); P = want; P.show(true); }
    // до нажатия кнопки видео только подготавливаем — чтобы по нажатию сразу включить его (iPhone иначе не даёт)
    P.load(src, Math.max(0, target()), started && state.s);
    seekAt = Date.now(); playingSince = 0; recent = [];
    return;
  }
  if (!started) return;
  const tgt = target(), ps = P.state(), base = state.r || 1;
  if (!state.s) {
    if (ps !== 'stop') P.pause();
    if (Math.abs(P.time() - tgt) > 0.5) P.seek(Math.max(0, tgt));
    if (P.rate() !== base) P.setRate(base);
    playingSince = 0;
    say('Пауза на компьютере.');
    return;
  }
  if (ps === 'stop') P.play();
  if (ps !== 'play') {
    // телефон может не дать включить видео сам (особенно iPhone) — тогда нужно одно касание по видео
    if (!stuckSince) stuckSince = Date.now();
    say(ps === 'stop' && Date.now() - stuckSince > 3000 ? '👇 Коснитесь видео ниже один раз — телефон не даёт включить его сам.' : 'Загрузка…');
    playingSince = 0;
    return;
  }
  stuckSince = 0;
  if (!playingSince) playingSince = Date.now();
  const d = tgt - P.time();  // > 0 — телефон отстаёт
  if (Date.now() - playingSince < 1500) { recent = []; if (P.rate() !== base) P.setRate(base); return; }  // дать разыграться
  if (justSeeked) {  // насколько промахнулась прошлая перемотка — учесть в следующей
    lead = Math.min(1.5, Math.max(0, lead + d * 0.7));
    localStorage.setItem('snd-lead', lead);
    justSeeked = false;
  }
  recent.push(d);
  if (recent.length > 5) recent.shift();
  // медиана последних замеров: один неточный замер не вызывает лишней перемотки
  const avg = [...recent].sort((a, b) => a - b)[recent.length >> 1];
  const far = Math.abs(d) > 2 && Date.now() - seekAt > 3000;  // перемотали на ПК — догнать сразу
  if (far || (!P.smooth && recent.length >= 3 && Math.abs(avg) > 0.3 && Date.now() - seekAt > 10000)) {
    if (P.rate() !== base) P.setRate(base);
    P.seek(Math.max(0, target() + lead));
    seekAt = Date.now(); playingSince = 0; recent = []; justSeeked = !far;
  } else if (P.smooth) {
    // до ±5% скорости: 0.3 с расхождения уходят примерно за 6 с, на слух незаметно
    const k = Math.abs(avg) < 0.04 ? 0 : Math.max(-0.05, Math.min(0.05, avg * 0.15));
    const r = Math.round(base * (1 + k) * 1000) / 1000;
    if (Math.abs(P.rate() - r) > 0.001) P.setRate(r);
  } else if (P.rate() !== base) P.setRate(base);
  say('Звук идёт: «' + P.title() + '». Расхождение ' + Math.abs(avg).toFixed(2) + ' с.' +
      (Date.now() - lastNew > 20000 ? ' (давно нет вестей с компьютера)' : ''));
}

// Плеер и опрос запускаем сразу при открытии страницы, а видео включаем прямо в нажатии кнопки:
// iPhone разрешает звук только тому видео, которое включили касанием — тогда второе касание не нужно.
window.onYouTubeIframeAPIReady = () => {
  if (!key) return;
  ytPlayer = new YT.Player('player', {
    playerVars: { playsinline: 1, controls: 0, disablekb: 1 },
    events: {
      onReady: () => { ytReady = true; tick(); },
      onError: e => say('YouTube не даёт играть это видео на другом сайте (ошибка ' + e.data + ').')
    }
  });
};
if (key) { setInterval(poll, 700); setInterval(tick, 1000); poll(); }

document.getElementById('start').onclick = () => {
  started = true;
  if (P) P.play();  // на паузе ПК tick сразу остановит — главное, что включили касанием
  // и обычный video «разрешаем» этим же касанием, чтобы потом фильм с другого сайта включился сам
  if (P !== h5) { vid.play().catch(() => {}); vid.pause(); }
  document.getElementById('start').hidden = true;
  document.getElementById('adj').hidden = false;
  say('Подключаюсь…');
  try { navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { try { navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
  });
  tick();
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
